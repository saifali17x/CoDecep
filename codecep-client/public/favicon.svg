<!-- CoDecep tab icon (UI polish part 2).

     A simplified redraw of the brand's circuit-tree mark: central trunk,
     symmetric branches, node dots at the tips. NOT the logo PNG itself — the
     main logo is 1877x1536 and 2.2MB, which is two orders of magnitude too
     heavy for an icon a browser renders at 16px, and downscaled to 16px its
     detail collapses into a green smudge. An SVG stays crisp at every size,
     costs about a kilobyte, and reads as the same mark.

     Colours are the brand's own and are fixed rather than themed: a browser
     tab is outside the app, so it has no theme to follow. Cordyceps Green on
     the artwork's black ground. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#000000"/>
  <g fill="none" stroke="#9fc473" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- trunk -->
    <path d="M32 55 V30"/>
    <!-- lower branch pair -->
    <path d="M32 40 L20 28"/>
    <path d="M32 40 L44 28"/>
    <!-- upper branch pair -->
    <path d="M32 30 L23 18"/>
    <path d="M32 30 L41 18"/>
    <!-- crown -->
    <path d="M32 30 V14"/>
  </g>
  <g fill="#9fc473">
    <!-- node dots at the branch tips, largest at the crown -->
    <circle cx="32" cy="11" r="4.4"/>
    <circle cx="22" cy="16" r="3"/>
    <circle cx="42" cy="16" r="3"/>
    <circle cx="18.5" cy="26" r="3.6"/>
    <circle cx="45.5" cy="26" r="3.6"/>
    <circle cx="32" cy="56.5" r="2.6"/>
  </g>
</svg>
